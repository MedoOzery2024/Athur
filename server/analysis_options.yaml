include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat dead code and unused imports as errors so they never reach main.
    unused_import: error
    unused_local_variable: warning

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - avoid_print
    - require_trailing_commas
