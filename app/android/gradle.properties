org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Point Gradle at Android Studio's bundled JDK so JAVA_HOME does have to be
# set globally. This is the JDK Android Studio itself uses to build.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
# Disable the incremental Kotlin compiler cache. On Windows, absolute paths from
# the pub cache (C:) and the project (D:) have different roots, which breaks
# the relocatable cache and produces intermittent build failures. Disabling it
# trades a little speed for reliable builds.
kotlin.incremental=false
# Run Kotlin compilation in-process instead of a separate daemon, avoiding the
# daemon RMI/classpath issues seen on this setup.
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
